###############################################################################
# Mikheyeva Art Gallery — Nginx virtual host
# Domain: mikheyeva.art
###############################################################################

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name mikheyeva.art;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://mikheyeva.art$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mikheyeva.art;

    ssl_certificate     /etc/letsencrypt/live/mikheyeva.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mikheyeva.art/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/mikheyeva.art/chain.pem;

    ssl_session_cache   shared:SSL_mikheyeva:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ── Uploaded files ─────────────────────────────────────────────────────────
    location /uploads/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend "http://mikheyeva_backend:4000";
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Backend API ────────────────────────────────────────────────────────────
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend "http://mikheyeva_backend:4000";
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    30s;
    }

    # ── Stripe webhook — no buffering, raw body needed ────────────────────────
    location /api/v1/payments/webhook {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend "http://mikheyeva_backend:4000";
        proxy_pass          $backend;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # ── Next.js static ─────────────────────────────────────────────────────────
    location /_next/static/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frontend "http://mikheyeva_frontend:3000";
        proxy_pass $frontend;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /_next/image {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frontend "http://mikheyeva_frontend:3000";
        proxy_pass         $frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        expires 7d;
    }

    # ── Everything else → Next.js frontend ────────────────────────────────────
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $frontend "http://mikheyeva_frontend:3000";
        proxy_pass         $frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
